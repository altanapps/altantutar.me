# Regenerates activity.html every hour. A commit only happens when the numbers
# moved, and each commit makes Railway redeploy the site.
name: Update activity page

on:
  schedule:
    - cron: "23 * * * *" # hourly, :23 — odd minute to dodge cron spikes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub contributions come via `gh api`; X posts via the public
      # syndication timeline (falls back to the committed cache on a 429).
      - name: Rebuild widgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_activity.py

      - name: Commit if changed
        run: |
          git config user.name "activity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add activity.html scripts/post-history.json scripts/x-timeline-cache.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Activity refresh"
          git push
